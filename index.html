<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgendaWeb · Nuevo registro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Aplica el tema guardado antes de pintar, para evitar un parpadeo -->
  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem("tema"); } catch (e) {}
      if (!tema) tema = matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro";
      document.documentElement.dataset.tema = tema;
    })();
  </script>
  <script src="js/tema.js" defer></script>
  <script src="js/registros.js" defer></script>
  <script src="js/proximos.js" defer></script>
  <script src="js/nuevo-registro.js" defer></script>
</head>
<body>

  <header class="barra">
    <a href="index.html" class="marca">Agenda<span>Web</span></a>
    <nav class="barra__nav">
      <a href="calendario.html" class="enlace">Calendario</a>
      <a href="index.html" class="enlace enlace--activo" aria-current="page">Nuevo registro</a>
    </nav>
    <button type="button" class="boton boton--icono" id="boton-tema"
            aria-label="Cambiar a modo claro" hidden>
      <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <main class="contenedor">

    <!-- Formulario principal -->
    <section class="tarjeta tarjeta--principal">
      <h1 class="titulo" id="formulario-titulo">Nuevo registro</h1>
      <p class="subtitulo" id="formulario-subtitulo">Agrega un evento o una cita a tu agenda.</p>

      <form class="formulario" id="formulario-registro" action="guardar.php" method="post">

        <!-- Vacío = registro nuevo; con número = se está editando ese registro -->
        <input type="hidden" name="id" id="registro-id">

        <!-- Tipo de registro -->
        <fieldset class="campo">
          <legend class="etiqueta">Tipo</legend>
          <div class="selector">
            <input type="radio" id="tipo-evento" name="tipo" value="evento" checked>
            <label for="tipo-evento">Evento</label>

            <input type="radio" id="tipo-cita" name="tipo" value="cita">
            <label for="tipo-cita">Cita</label>
          </div>
        </fieldset>

        <!-- Título -->
        <div class="campo">
          <label class="etiqueta" for="titulo">Título</label>
          <input class="entrada" type="text" id="titulo" name="titulo"
                 placeholder="Ej. Revisión del proyecto final" required maxlength="80">
        </div>

        <!-- Fecha y horas -->
        <div class="fila">
          <div class="campo">
            <label class="etiqueta" for="fecha">Fecha</label>
            <input class="entrada" type="date" id="fecha" name="fecha" required>
          </div>
          <div class="campo">
            <label class="etiqueta" for="hora-inicio">Inicio</label>
            <input class="entrada" type="time" id="hora-inicio" name="hora_inicio" required>
          </div>
          <div class="campo">
            <label class="etiqueta" for="hora-fin">Fin</label>
            <input class="entrada" type="time" id="hora-fin" name="hora_fin">
          </div>
        </div>

        <!-- Lugar y con quién -->
        <div class="fila fila--2">
          <div class="campo">
            <label class="etiqueta" for="lugar">Lugar</label>
            <input class="entrada" type="text" id="lugar" name="lugar"
                   placeholder="Sala B, Zoom, consultorio…" maxlength="120">
          </div>
          <div class="campo">
            <label class="etiqueta" for="persona">Con quién <span class="opcional">(opcional)</span></label>
            <input class="entrada" type="text" id="persona" name="persona"
                   placeholder="Nombre de la persona" maxlength="80">
          </div>
        </div>

        <!-- Categoría y recordatorio -->
        <div class="fila fila--2">
          <div class="campo">
            <label class="etiqueta" for="categoria">Categoría</label>
            <select class="entrada" id="categoria" name="categoria">
              <option value="escuela">Escuela</option>
              <option value="trabajo">Trabajo</option>
              <option value="salud">Salud</option>
              <option value="personal">Personal</option>
            </select>
          </div>
          <div class="campo">
            <label class="etiqueta" for="recordatorio">Recordatorio</label>
            <select class="entrada" id="recordatorio" name="recordatorio">
              <option value="0">Sin recordatorio</option>
              <option value="15" selected>15 minutos antes</option>
              <option value="60">1 hora antes</option>
              <option value="1440">1 día antes</option>
            </select>
          </div>
        </div>

        <!-- Prioridad -->
        <fieldset class="campo">
          <legend class="etiqueta">Prioridad</legend>
          <div class="selector selector--3">
            <input type="radio" id="prio-baja" name="prioridad" value="baja">
            <label for="prio-baja">Baja</label>

            <input type="radio" id="prio-media" name="prioridad" value="media" checked>
            <label for="prio-media">Media</label>

            <input type="radio" id="prio-alta" name="prioridad" value="alta">
            <label for="prio-alta">Alta</label>
          </div>
        </fieldset>

        <!-- Notas -->
        <div class="campo">
          <label class="etiqueta" for="notas">Notas</label>
          <textarea class="entrada entrada--area" id="notas" name="notas" rows="4"
                    placeholder="Detalles, materiales que llevar, enlaces…" maxlength="1000"></textarea>
        </div>

        <!-- Casilla -->
        <label class="casilla">
          <input type="checkbox" id="todo-el-dia" name="todo_el_dia">
          <span>Todo el día</span>
        </label>

        <!-- Resultado del envío (lo llena js/nuevo-registro.js) -->
        <div class="aviso" id="aviso" role="status" hidden></div>

        <!-- Acciones -->
        <div class="acciones">
          <button type="button" class="boton boton--peligro" id="boton-eliminar" hidden>Eliminar</button>
          <button type="reset" class="boton boton--secundario" id="boton-limpiar">Limpiar</button>
          <button type="submit" class="boton boton--primario">Guardar registro</button>
        </div>

      </form>
    </section>

    <!-- Próximos registros (los carga js/proximos.js desde registros.php) -->
    <aside class="lateral">
      <h2 class="titulo titulo--chico">Próximos</h2>
      <div class="lista-registros" id="proximos-lista">
        <div class="tarjeta tarjeta--vacia"><p>Cargando registros…</p></div>
      </div>
      <a class="enlace" href="calendario.html">Ver todo en el calendario</a>
    </aside>

  </main>

</body>
</html>
